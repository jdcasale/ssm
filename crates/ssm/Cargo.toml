[package]
name = "ssm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared state machines for Rust - thread-safe state machines with RwLock"

[features]
default = []
async = ["tokio"]

[dependencies]
tokio = { version = "1", features = ["sync"], optional = true }
ssm-macro = { workspace = true }
